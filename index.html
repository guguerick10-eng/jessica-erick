<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jessica ❤️ Erick</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ff6f91;
    color: white;
    text-align: center;
}

/* TELA DE ENTRADA */
#entrada {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #ff4f7b;
}

.coracao {
    font-size: 100px;
    cursor: pointer;
    animation: pulsar 1s infinite;
}

@keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* CONTEÚDO PRINCIPAL */
#conteudo {
    display: none;
    padding: 30px;
}

button {
    background: white;
    color: #ff4f7b;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="entrada">
    <h2>Clique no meu coração ❤️</h2>
    <div class="coracao" onclick="abrirSite()">❤️</div>
</div>

<div id="conteudo">
    <h1>Jessica ❤️ Erick</h1>
    <p>
    Desde 10/10/2025 minha vida ganhou mais cor,
    mais paz e mais sentido. Você é minha escolha diária,
    meu amor sem medida e o futuro que eu quero
    construir todos os dias.
    </p>

    <h3 id="contador"></h3>

    <button onclick="alert('Eu te amo infinitamente ❤️')">
    Clique aqui meu amor ✨
    </button>
</div>

<script>
function abrirSite() {
    document.getElementById("entrada").style.display = "none";
    document.getElementById("conteudo").style.display = "block";
}

var dataInicio = new Date("2025-10-10T00:00:00");

function atualizarContador() {
    var agora = new Date();
    var diferenca = agora - dataInicio;

    var dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    var horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    var minutos = Math.floor((diferenca / (1000 * 60)) % 60);
    var segundos = Math.floor((diferenca / 1000) % 60);

    document.getElementById("contador").innerHTML =
        "Estamos juntos há ❤️ " +
        dias + " dias, " +
        horas + " horas, " +
        minutos + " minutos e " +
        segundos + " segundos";
}

setInterval(atualizarContador, 1000);
</script>

</body>
</html>

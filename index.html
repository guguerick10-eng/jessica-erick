<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Jessica ❤️ Erick — Nosso Universo de Amor</title>

  <!-- Fontes Românticas do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIÁVEIS E RESET GLOBAL (ANTI-ROLAGEM HORIZONTAL)
       ========================================================================== */
    :root {
      --bg-deep: #020716;
      --bg-navy: #061330;
      --neon-red: #ff1e42;
      --neon-red-soft: #ff4d6d;
      --text-white: #ffffff;
      --text-soft: #dce8ff;
      --card-bg: rgba(7, 20, 48, 0.76);
      --font-cursive: 'Great Vibes', cursive;
      --font-hand: 'Dancing Script', cursive;
      --font-sans: 'Montserrat', sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-deep);
      color: var(--text-white);
      font-family: var(--font-sans);
      overflow-x: clip;
      width: 100%;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, #0d2758 0%, #050e24 50%, #020611 100%);
      min-height: 100vh;
      width: 100%;
      overflow-x: clip;
      position: relative;
      line-height: 1.5;
    }

    body.locked {
      overflow: hidden;
      height: 100vh;
    }

    img, svg {
      max-width: 100%;
      display: block;
    }

    /* ==========================================================================
       CANVAS DE ESTRELAS E CHUVA DE CORAÇÕES
       ========================================================================== */
    #universe-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       ELEMENTOS VISUAIS REUTILIZÁVEIS (LUA, CORAÇÕES 3D, ROSAS, TÍTULOS)
       ========================================================================== */
    .moon-svg-anim {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: drop-shadow(0 0 30px rgba(170, 215, 255, 0.85))
              drop-shadow(0 0 70px rgba(90, 165, 255, 0.55));
      animation: moonPulse 6s ease-in-out infinite alternate;
      user-select: none;
      pointer-events: none;
    }

    @keyframes moonPulse {
      0% {
        transform: scale(0.98);
        filter: drop-shadow(0 0 25px rgba(170, 215, 255, 0.75))
                drop-shadow(0 0 60px rgba(90, 165, 255, 0.45));
      }
      100% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 40px rgba(200, 235, 255, 0.95))
                drop-shadow(0 0 90px rgba(110, 185, 255, 0.75));
      }
    }

    .floating-heart-3d {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(255, 25, 65, 0.8));
      animation: floatHeart 5s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) rotate(-6deg) scale(1); }
      50% { transform: translateY(-14px) rotate(6deg) scale(1.06); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.16); }
      30% { transform: scale(0.96); }
      45% { transform: scale(1.1); }
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      text-align: center;
      position: relative;
      z-index: 4;
      width: 100%;
    }

    .section-title-line {
      height: 1px;
      flex: 1;
      max-width: 85px;
      background: linear-gradient(90deg, transparent, rgba(255, 80, 110, 0.85), #ffffff);
    }

    .section-title-line.right {
      background: linear-gradient(90deg, #ffffff, rgba(255, 80, 110, 0.85), transparent);
    }

    .section-title-heart {
      color: var(--neon-red);
      font-size: 1.2rem;
      text-shadow: 0 0 12px var(--neon-red);
      animation: heartBeat 2s infinite;
      flex-shrink: 0;
    }

    .section-title {
      font-family: var(--font-cursive);
      font-size: clamp(2rem, 5.5vw, 3.1rem);
      font-weight: 400;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 4px 12px rgba(0, 0, 0, 0.8);
      line-height: 1.2;
      text-wrap: balance;
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .corner-roses {
      position: absolute;
      bottom: -6px;
      width: clamp(130px, 22vw, 260px);
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.85));
      opacity: 0.9;
    }

    .corner-roses.left {
      left: -8px;
    }

    .corner-roses.right {
      right: -8px;
      transform: scaleX(-1);
    }

    /* ==========================================================================
       2. TELA INICIAL DE ENTRADA (SPLASH SCREEN)
       ========================================================================== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at 50% 30%, rgba(85, 160, 255, 0.32) 0%, rgba(14, 42, 96, 0.68) 40%, rgba(3, 9, 25, 0.98) 80%),
        linear-gradient(180deg, #020716 0%, #081c42 60%, #030919 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px 60px;
      overflow: hidden;
      transition: opacity 0.9s ease, transform 0.9s ease, visibility 0.9s;
    }

    #splash-screen.hidden-splash {
      opacity: 0;
      transform: scale(1.06);
      visibility: hidden;
      pointer-events: none;
    }

    .night-clouds {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 70%, rgba(22, 62, 130, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 80% 65%, rgba(30, 82, 160, 0.45) 0%, transparent 45%);
      pointer-events: none;
      z-index: 1;
    }

    .splash-inner {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
    }

    .splash-moon-box {
      width: clamp(135px, 22vw, 230px);
      height: clamp(135px, 22vw, 230px);
      margin: 0 auto;
    }

    .splash-phrase {
      font-family: var(--font-cursive);
      font-size: clamp(2.15rem, 6.5vw, 3.7rem);
      line-height: 1.24;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.65),
        0 0 35px rgba(120, 185, 255, 0.6),
        0 4px 15px rgba(0, 0, 0, 0.9);
      max-width: 620px;
      text-wrap: balance;
      padding: 0 8px;
    }

    .heart-open-btn {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      width: clamp(190px, 48vw, 225px);
      height: clamp(170px, 43vw, 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease, filter 0.35s ease;
      animation: pulseHeartBtn 2.2s ease-in-out infinite;
      outline: none;
      margin-top: 4px;
    }

    .heart-open-btn:hover,
    .heart-open-btn:focus {
      transform: scale(1.07);
      filter: drop-shadow(0 0 28px rgba(255, 30, 70, 1));
    }

    .heart-open-btn.clicked-heart {
      transform: scale(1.3);
      filter: drop-shadow(0 0 60px #ff1e42) brightness(1.3);
    }

    @keyframes pulseHeartBtn {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 16px rgba(255, 25, 65, 0.85))
                drop-shadow(0 0 36px rgba(255, 10, 50, 0.5));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 26px rgba(255, 45, 85, 1))
                drop-shadow(0 0 55px rgba(255, 20, 60, 0.8));
      }
    }

    .heart-btn-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .heart-btn-label {
      position: relative;
      z-index: 2;
      font-family: var(--font-cursive);
      font-size: clamp(1.75rem, 5vw, 2.05rem);
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 255, 255, 0.8);
      margin-top: -12px;
      pointer-events: none;
    }

    /* ==========================================================================
       3. CABEÇALHO DO SITE (HEADER FIXO E RESPONSIVO)
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(3, 10, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 50, 85, 0.28);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-logo {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-cursive);
      font-size: clamp(1.9rem, 4vw, 2.45rem);
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
      white-space: nowrap;
    }

    .brand-heart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--neon-red);
      filter: drop-shadow(0 0 10px var(--neon-red));
      animation: heartBeat 2.2s infinite;
      font-size: 1.35rem;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-nav a {
      text-decoration: none;
      color: var(--text-soft);
      font-size: 0.86rem;
      font-weight: 500;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
      position: relative;
      white-space: nowrap;
    }

    .main-nav a:hover,
    .main-nav a.active {
      color: #ffffff;
      background: rgba(255, 30, 66, 0.16);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .main-nav a.active::after,
    .main-nav a:hover::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 15%;
      width: 70%;
      height: 2px;
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red);
      border-radius: 2px;
    }

    .nav-icon {
      font-size: 0.95rem;
      line-height: 1;
    }

    /* ==========================================================================
       ESTRUTURA DAS SEÇÕES PRINCIPAIS
       ========================================================================== */
    .scene-band {
      position: relative;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 56px 24px 68px;
      border-bottom: 1px solid rgba(120, 175, 255, 0.16);
      overflow: hidden;
      z-index: 4;
    }

    .scene-band::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(32, 88, 175, 0.26) 0%, transparent 62%),
        radial-gradient(circle at 20% 80%, rgba(16, 45, 100, 0.32) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ==========================================================================
       4 & 5. SEÇÃO PRINCIPAL (DECLARAÇÃO) + CASAL NO PÍER + CONTADOR DO AMOR
       ========================================================================== */
    .hero-declaration-grid {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1.1fr 0.95fr 0.95fr;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .hero-declaration-grid > * {
      min-width: 0;
      width: 100%;
    }

    .declaration-box {
      text-align: center;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .declaration-title {
      font-family: var(--font-cursive);
      font-size: clamp(2.35rem, 5.5vw, 3.5rem);
      line-height: 1.2;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.55),
        0 4px 14px rgba(0, 0, 0, 0.85);
      text-wrap: balance;
      max-width: 480px;
    }

    .ornament-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .ornament-divider span.line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 225, 255, 0.8), transparent);
    }

    .ornament-divider span.heart-outline {
      color: #dceeff;
      font-size: 1.25rem;
      text-shadow: 0 0 10px rgba(160, 210, 255, 0.9);
    }

    .declaration-text {
      font-size: clamp(0.95rem, 2.6vw, 1.06rem);
      line-height: 1.65;
      color: var(--text-soft);
      max-width: 440px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      text-wrap: pretty;
    }

    .neon-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      margin-top: 6px;
      padding: 10px 26px;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(160, 15, 45, 0.72), rgba(65, 8, 25, 0.9));
      border: 1.5px solid #ff3b60;
      box-shadow:
        0 0 16px rgba(255, 30, 66, 0.7),
        inset 0 0 12px rgba(255, 70, 100, 0.45);
      color: #ffffff;
      text-decoration: none;
      font-family: var(--font-cursive);
      font-size: clamp(1.5rem, 4.5vw, 1.75rem);
      letter-spacing: 0.5px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-width: 100%;
    }

    .neon-pill-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 0 24px rgba(255, 30, 66, 0.95),
        inset 0 0 18px rgba(255, 100, 130, 0.65);
    }

    .pier-scene-col {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pier-moon {
      width: clamp(165px, 42vw, 235px);
      height: clamp(165px, 42vw, 235px);
      margin-bottom: -48px;
      position: relative;
      z-index: 1;
    }

    .couple-pier-svg {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 330px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.95));
    }

    .counter-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* AJUSTE PARA O CONTADOR FICAR PERFEITAMENTE DENTRO DO CORAÇÃO */
    .heart-counter-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      min-height: 295px;
      padding: 30px 14px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0 auto;
    }

    .heart-counter-frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 15px rgba(255, 25, 65, 0.85));
    }

    .counter-inner-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .counter-title {
      font-family: var(--font-cursive);
      font-size: clamp(1.35rem, 4vw, 1.55rem);
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      max-width: 210px;
      text-wrap: balance;
    }

    .counter-subtitle {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-top: 1px;
    }

    .counter-days-highlight {
      font-size: clamp(1.75rem, 5.2vw, 2.1rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow:
        0 0 12px var(--neon-red),
        0 0 24px var(--neon-red);
      line-height: 1.1;
      margin: 1px 0;
    }

    .counter-days-highlight span.days-label {
      font-family: var(--font-cursive);
      font-weight: 400;
      font-size: clamp(1.65rem, 4.8vw, 1.95rem);
      margin-left: 4px;
    }

    .counter-hms-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 2px;
      width: 100%;
    }

    .hms-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }

    .hms-value {
      font-size: clamp(1.05rem, 3.2vw, 1.2rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 80, 110, 0.85);
    }

    .hms-label {
      font-size: 0.68rem;
      color: #c5d9ff;
    }

    .counter-eternity-note {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--text-soft);
      max-width: 240px;
      line-height: 1.4;
      text-align: center;
    }

    /* ==========================================================================
       6 & 7. GALERIA DE FOTOS (FOTOS INTEIRAS SEM CORTE) + MÚSICA LOCAL
       ========================================================================== */
    .memories-music-grid {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
      align-items: center;
      width: 100%;
    }

    .memories-music-grid > * {
      min-width: 0;
      width: 100%;
    }

    .polaroid-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 8px 4px;
      width: 100%;
    }

    .polaroid-card {
      background: #f8f9fc;
      padding: 9px 9px 16px 9px;
      border-radius: 6px;
      width: 144px;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.75),
        0 0 15px rgba(140, 185, 255, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      user-select: none;
    }

    .polaroid-card:nth-child(1) { transform: rotate(-4deg); }
    .polaroid-card:nth-child(2) { transform: rotate(3deg); }
    .polaroid-card:nth-child(3) { transform: rotate(-2.5deg); }
    .polaroid-card:nth-child(4) { transform: rotate(3.5deg); }
    .polaroid-card:nth-child(5) { transform: rotate(-2.5deg); }

    .polaroid-card:hover {
      transform: rotate(0deg) scale(1.06) translateY(-5px) !important;
      z-index: 10;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.9),
        0 0 22px rgba(255, 45, 85, 0.75);
    }

    .polaroid-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #081226; /* Fundo elegante para fotos inteiras */
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ALTERADO PARA OBJECT-FIT: CONTAIN (EXibe a foto inteira sem cortar) */
    .polaroid-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .polaroid-placeholder-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .polaroid-caption {
      margin-top: 10px;
      font-family: var(--font-cursive);
      font-size: 1.25rem;
      color: #1c2536;
      text-align: center;
      line-height: 1.15;
    }

    .polaroid-caption span.red-heart {
      color: #e01b3f;
      font-family: var(--font-sans);
      font-size: 0.82rem;
    }

    /* Seção 7: Cartão Musical Local */
    .music-section-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .music-header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-cursive);
      font-size: clamp(1.85rem, 5vw, 2.35rem);
      color: #ffffff;
      margin-bottom: 14px;
      text-align: center;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
      line-height: 1.2;
      text-wrap: balance;
    }

    .music-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(145deg, rgba(10, 28, 66, 0.92), rgba(4, 12, 32, 0.96));
      border: 1px solid rgba(120, 175, 255, 0.4);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(60, 130, 255, 0.28),
        inset 0 0 18px rgba(255, 30, 66, 0.14);
      position: relative;
      overflow: hidden;
    }

    .music-top-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .music-moon-disc {
      width: 80px;
      height: 80px;
      border-radius: 50%;

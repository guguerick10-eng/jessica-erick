<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessica ❤️ Erick</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color:white;
    text-align:center;
}

/* ENTRADA */
#entrada{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#entrada h2{
    font-size:22px;
    margin-bottom:20px;
}

.coracao{
    font-size:90px;
    cursor:pointer;
    animation:pulsar 1.2s infinite;
}

@keyframes pulsar{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
}

/* CONTEÚDO */
#conteudo{
    display:none;
    min-height:100vh;
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:20px;
    max-width:500px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:15px;
}

p{
    line-height:1.6;
    margin-bottom:20px;
}

#contador{
    margin-bottom:25px;
    font-weight:bold;
}

button{
    background:white;
    color:#ff4f7b;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div id="entrada">
    <h2>Clique no meu coração ❤️</h2>
    <div class="coracao" onclick="abrirSite()">❤️</div>
</div>

<div id="conteudo">
    <div class="card">
        <h1>Jessica ❤️ Erick</h1>
        <p>
        Desde 10/10/2025 minha vida ganhou mais cor,
        mais paz e mais sentido. Você é minha escolha diária,
        meu amor sem medida e o futuro que eu quero
        construir todos os dias.
        </p>

        <div id="contador"></div>

        <button onclick="alert('Eu te amo infinitamente ❤️')">
        Clique aqui meu amor ✨
        </button>
    </div>
</div>

<script>
function abrirSite(){
    document.getElementById("entrada").style.display="none";
    document.getElementById("conteudo").style.display="flex";
}

var dataInicio = new Date("2025-04-10T00:00:00");
function atualizarContador(){
    var agora = new Date();
    var diferenca = agora - dataInicio;

    var dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    var horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    var minutos = Math.floor((diferenca / (1000 * 60)) % 60);
    var segundos = Math.floor((diferenca / 1000) % 60);

    document.getElementById("contador").innerHTML =
        "Estamos juntos há ❤️ " +
        dias + " dias, " +
        horas + " horas, " +
        minutos + " minutos e " +
        segundos + " segundos";
}

setInterval(atualizarContador,1000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessica ❤️ Erick</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #0a0f2c, #111a40);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* TELA DE ENTRADA */
#entrada {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

/* LUA */
.lua {
    position: absolute;
    top: 60px;
    right: 40px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #f5f3ce 40%, #e0dca5 70%);
    border-radius: 50%;
    box-shadow: 0 0 40px #f5f3ce;
}

/* CORAÇÃO CENTRAL */
.coracao {
    font-size: 80px;
    cursor: pointer;
    animation: pulsar 1.5s infinite;
    z-index: 2;
}

@keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* CORAÇÕES CAINDO */
.heart {
    position: fixed;
    top: -10px;
    color: red;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
    }
}

/* CONTEÚDO */
#conteudo {
    display: none;
    padding: 30px 20px;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="entrada">
    <div class="lua"></div>
    <h2>Sob a mesma lua... 🌙</h2>
    <p>Clique no coração meu amor ❤️</p>
    <div class="coracao" onclick="abrirSite()">❤️</div>
</div>

<div id="conteudo">
    <h1>Jessica ❤️ Erick</h1>
    <p>
    Desde 10 de Abril de 2025,<br>
    minha vida ganhou mais cor,<br>
    mais paz e mais sentido.<br><br>
    Você é meu amor sem medida,<br>
    minha escolha diária,<br>
    e o futuro que eu quero construir todos os dias.
    </p>

    <h3 id="contador"></h3>

    <button onclick="alert('Eu te amo infinitamente ❤️')">
        Clique aqui meu amor ✨
    </button>
</div>

    document.getElementById("entrada").style.display = "none";
    document.getElementById("conteudo").style.display = "block";
}

function atualizarContador() {
    var agora = new Date();
    var diferenca = agora - dataInicio;

    var dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    var horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    var minutos = Math.floor((diferenca / (1000 * 60)) % 60);

        "Estamos juntos há ❤️ " +
        dias + " dias, " +
        horas + " horas, " +
        minutos + " minutos e " +
        segundos + " segundos";
}

setInterval(atualizarContador, 1000);
